<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>រឿងភាគចិនខ្លីៗ - Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Siemreap', sans-serif, Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }
        h2 { text-align: center; color: #38bdf8; }
        .user-info {
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .movie-card {
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .movie-content {
            padding: 12px;
        }
        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .badge-free { background: #22c55e; color: white; }
        .badge-vip { background: #eab308; color: black; }
        
        /* Video Player Styling */
        video {
            width: 100%;
            border-radius: 6px;
            margin-top: 8px;
            background: #000;
        }
        .locked-msg {
            background: #ef4444;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h2>🎬 រឿងភាគចិនខ្លីៗ</h2>
    
    <div class="user-info" id="userInfo">
        កំពុងផ្ទុកទិន្នន័យ User...
    </div>

    <div id="movieList">
        <p style="text-align: center;">កំពុងទាញយករឿង...</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let user = tg.initDataUnsafe.user;
        let telegramId = user ? user.id : "GUEST_123";

        document.getElementById('userInfo').innerHTML = `👤 <b>ស្វាគមន៍៖</b> ${user ? user.first_name : 'ភ្ញៀវ'} | ID: ${telegramId}`;

        // ជំនួស Google Apps Script Web App URL របស់អ្នកនៅទីនេះ
        const API_URL = "https://script.google.com/macros/s/AKfycbw84JSDD3mYSD2XwrqXLqOASDdIDfwhvIgbv2p4Zy5pH7w1ChCg47VXS9_prjEgMUcI/exec";

        let userStatus = "Free";

        function checkUserStatus() {
            fetch(`${API_URL}?action=checkUser&telegramId=${telegramId}`)
                .then(response => response.json())
                .then(data => {
                    if(data.status === "success") {
                        userStatus = data.data.status;
                        if(userStatus === "VIP") {
                            document.getElementById('userInfo').innerHTML += `<br>⭐ ស្ថានភាព៖ <span style="color: #eab308; font-weight: bold;">VIP Member</span>`;
                        } else {
                            document.getElementById('userInfo').innerHTML += `<br>⭐ ស្ថានភាព៖ Free`;
                        }
                    }
                    loadMovies();
                })
                .catch(err => {
                    console.error(err);
                    loadMovies();
                });
        }

        function loadMovies() {
            fetch(`${API_URL}?action=getMovies`)
                .then(response => response.json())
                .then(data => {
                    if(data.status === "success") {
                        let movies = data.data;
                        let html = "";
                        
                        movies.forEach(movie => {
                            let isVipMovie = movie.type === "VIP";
                            let canWatch = !isVipMovie || (userStatus === "VIP");
                            
                            html += `
                                <div class="movie-card">
                                    <img src="${movie.thumbnail}" alt="${movie.title}">
                                    <div class="movie-content">
                                        <div class="movie-title">${movie.title} - ភាគទី ${movie.episode}</div>
                                        <span class="badge ${isVipMovie ? 'badge-vip' : 'badge-free'}">${movie.type}</span>
                                        
                                        ${canWatch ? 
                                            `<video controls controlsList="nodownload">
                                                <source src="${movie.videoUrl}" type="video/mp4">
                                                Browser របស់អ្នកមិនគាំទ្រ Video Player ទេ។
                                             </video>` : 
                                            `<div class="locked-msg">🔒 រឿង VIP (សូមទាក់ទង Admin ដើម្បីបង់ប្រាក់ទស្សនា)</div>`
                                        }
                                    </div>
                                </div>
                            `;
                        });
                        document.getElementById('movieList').innerHTML = html;
                    }
                })
                .catch(err => {
                    document.getElementById('movieList').innerHTML = "<p style='text-align: center; color: red;'>បរាជ័យក្នុងការទាញទិន្នន័យរឿង</p>";
                });
        }

        checkUserStatus();
    </script>
</body>
</html>
